apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: bridgecart
image: rancher/k3s:v1.35.2-k3s1
servers: 1
agents: 1
kubeAPI:
  hostIP: 127.0.0.1
  hostPort: "6550"
ports:
  - port: 127.0.0.1:8088:80
    nodeFilters:
      - loadbalancer
options:
  k3d:
    wait: true
    timeout: 180s
    disableRollback: true
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: false
