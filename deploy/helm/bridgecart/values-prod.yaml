stage: production
frontend:
  enabled: true
  image: registry.example.com/bridgecart/frontend:0.7.0
  imagePullPolicy: Always
  host: app.example.com
  gatewayUrl: https://api.example.com/mcp
  ingress:
    tls: {enabled: true, secretName: replace-with-existing-dashboard-tls-secret}
backend:
  enabled: true
  image: registry.example.com/bridgecart/backend:0.7.0
  imagePullPolicy: Always
  host: api.example.com
  databaseSecret: replace-with-existing-postgres-secret
  initialAdminSecret: replace-with-existing-initial-admin-secret
  cookieSecure: true
  cookieSameSite: lax
  corsOrigins: https://app.example.com
  gateway:
    enabled: true
    encryptionSecret: replace-with-existing-upstream-encryption-secret
    allowedUrls:
      - http://bridgecart-woocommerce-mcp:8001/mcp
      - http://bridgecart-inventory-mcp:8002/mcp
      - http://bridgecart-shipping-mcp:8003/mcp
  ingress:
    tls: {enabled: true, secretName: replace-with-existing-api-tls-secret}
postgres:
  enabled: true
  credentialsSecret: replace-with-existing-postgres-secret
  storage: {className: replace-with-durable-storage-class, size: 20Gi}
woocommerceMcp:
  enabled: true
  image: registry.example.com/bridgecart/woocommerce-mcp:0.3.4
  imagePullPolicy: Always
  apiSecret: replace-with-existing-woocommerce-api-secret
  bearerSecret: replace-with-existing-mcp-bearer-secret
inventoryMcp:
  enabled: true
  image: registry.example.com/bridgecart/inventory-mcp:0.5.0
  imagePullPolicy: Always
  bearerSecret: replace-with-existing-inventory-bearer-secret
shippingMcp:
  enabled: true
  image: registry.example.com/bridgecart/shipping-mcp:0.5.0
  imagePullPolicy: Always
  bearerSecret: replace-with-existing-shipping-bearer-secret
store:
  host: shop.example.com
  publicUrl: https://shop.example.com
  credentialsSecret: replace-with-existing-production-secret
  wordpress:
    adminEmail: admin@example.com
    title: Production Store
    storage: {className: replace-with-durable-storage-class, size: 20Gi}
  mariadb:
    storage: {className: replace-with-durable-storage-class, size: 20Gi}
  bootstrap:
    seedDemoProduct: false
    enableCod: false
    enableDemoShipping: false
    makeStoreLive: false
    makeShopHomepage: false
  ingress:
    tls: {enabled: true, secretName: replace-with-existing-tls-secret}
