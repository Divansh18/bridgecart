stage: production
woocommerceMcp:
  enabled: true
  image: registry.example.com/bridgecart/woocommerce-mcp:0.3.4
  imagePullPolicy: Always
  apiSecret: replace-with-existing-woocommerce-api-secret
  bearerSecret: replace-with-existing-mcp-bearer-secret
store:
  host: shop.example.com
  publicUrl: https://shop.example.com
  credentialsSecret: replace-with-existing-production-secret
  wordpress:
    adminEmail: admin@example.com
    title: Production Store
    storage: {className: replace-with-durable-storage-class, size: 20Gi}
  mariadb:
    storage: {className: replace-with-durable-storage-class, size: 20Gi}
  bootstrap:
    seedDemoProduct: false
    enableCod: false
    enableDemoShipping: false
    makeStoreLive: false
    makeShopHomepage: false
  ingress:
    tls: {enabled: true, secretName: replace-with-existing-tls-secret}
