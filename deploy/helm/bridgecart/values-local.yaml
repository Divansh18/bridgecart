stage: local
backend:
  enabled: true
  gateway:
    enabled: true
  host: api.bridgecart.local
  cookieSecure: false
  cookieSameSite: lax
  ingress:
    tls: {enabled: false, secretName: ""}
postgres:
  enabled: true
  storage: {className: local-path, size: 5Gi}
woocommerceMcp:
  enabled: true
inventoryMcp:
  enabled: true
shippingMcp:
  enabled: true
store:
  host: shop.bridgecart.local
  publicUrl: http://shop.bridgecart.local:8088
  credentialsSecret: bridgecart-store-credentials
  wordpress:
    storage: {className: local-path, size: 5Gi}
  mariadb:
    storage: {className: local-path, size: 5Gi}
  bootstrap:
    seedDemoProduct: true
    enableCod: true
    enableDemoShipping: true
    makeStoreLive: true
    makeShopHomepage: true
  ingress:
    tls: {enabled: false, secretName: ""}
