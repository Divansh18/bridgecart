stage: local
frontend:
  enabled: false
  image: bridgecart/frontend:0.6.3
  imagePullPolicy: IfNotPresent
  host: app.bridgecart.local
  gatewayUrl: http://api.bridgecart.local:8088/mcp
  ingress:
    className: traefik
    tls: {enabled: false, secretName: ""}
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 250m, memory: 128Mi}
backend:
  enabled: false
  image: bridgecart/backend:0.6.0
  imagePullPolicy: IfNotPresent
  host: api.bridgecart.local
  databaseSecret: bridgecart-postgres-credentials
  initialAdminSecret: bridgecart-initial-admin
  cookieSecure: false
  cookieSameSite: lax
  corsOrigins: http://localhost:5173
  gateway:
    enabled: false
    encryptionSecret: bridgecart-upstream-encryption
    allowedUrls:
      - http://bridgecart-woocommerce-mcp:8001/mcp
      - http://bridgecart-inventory-mcp:8002/mcp
      - http://bridgecart-shipping-mcp:8003/mcp
    extraEgress: []
  ingress:
    className: traefik
    namespace: kube-system
    podLabels: {app.kubernetes.io/name: traefik}
    tls: {enabled: false, secretName: ""}
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
  migrationResources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
postgres:
  enabled: false
  image: docker.io/library/postgres:17.11-bookworm
  imagePullPolicy: IfNotPresent
  database: bridgecart
  user: bridgecart
  credentialsSecret: bridgecart-postgres-credentials
  storage: {className: local-path, size: 5Gi}
  networkPolicy: {enabled: true}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
mcpServers: {enabled: false}
inventoryMcp:
  enabled: false
  image: bridgecart/inventory-mcp:0.5.0
  imagePullPolicy: IfNotPresent
  bearerSecret: bridgecart-inventory-mcp-bearer
  resources:
    requests: {cpu: 25m, memory: 96Mi}
    limits: {cpu: 250m, memory: 256Mi}
shippingMcp:
  enabled: false
  image: bridgecart/shipping-mcp:0.5.0
  imagePullPolicy: IfNotPresent
  bearerSecret: bridgecart-shipping-mcp-bearer
  resources:
    requests: {cpu: 25m, memory: 96Mi}
    limits: {cpu: 250m, memory: 256Mi}
woocommerceMcp:
  enabled: false
  image: bridgecart/woocommerce-mcp:0.3.4
  imagePullPolicy: IfNotPresent
  apiSecret: bridgecart-woocommerce-api
  bearerSecret: bridgecart-mcp-bearer
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
store:
  enabled: true
  host: shop.bridgecart.local
  publicUrl: http://shop.bridgecart.local:8088
  credentialsSecret: bridgecart-store-credentials
  wordpress:
    image: docker.io/library/wordpress:7.1.2-php8.3-apache
    adminUser: bridgecart-admin
    adminEmail: admin@bridgecart.local
    title: BridgeCart Demo Store
    storage: {className: local-path, size: 5Gi}
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
  mariadb:
    image: docker.io/library/mariadb:11.8.9
    database: wordpress
    user: wordpress
    storage: {className: local-path, size: 5Gi}
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
  bootstrap:
    enabled: true
    image: docker.io/library/wordpress:cli-2.12.0-php8.3
    woocommerceVersion: 11.2.1
    allowPluginUpgrade: false
    seedDemoProduct: true
    enableCod: true
    enableDemoShipping: true
    makeStoreLive: false
    makeShopHomepage: false
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
  ingress:
    className: traefik
    tls: {enabled: false, secretName: ""}
  networkPolicy:
    enabled: true
    ingressNamespace: kube-system
    ingressPodLabels:
      app.kubernetes.io/name: traefik
