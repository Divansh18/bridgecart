{{- if .Values.store.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "bridgecart.fullname" . }}-wordpress
  labels:
    {{- include "bridgecart.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.store.ingress.className | quote }}
  {{- if .Values.store.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.store.host | quote }}]
      secretName: {{ .Values.store.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.store.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "bridgecart.fullname" . }}-wordpress
                port:
                  name: http
{{- end }}
