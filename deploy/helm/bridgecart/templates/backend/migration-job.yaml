{{- if .Values.backend.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "bridgecart.fullname" . }}-backend-migrate
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    {{- include "bridgecart.labels" . | nindent 4 }}
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "bridgecart.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend-migration
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: {{ .Values.backend.image | quote }}
          imagePullPolicy: {{ .Values.backend.imagePullPolicy }}
          command: [/bin/sh, -ec]
          args: ["/app/.venv/bin/alembic upgrade head && /app/.venv/bin/python -m bridgecart.auth.bootstrap"]
          env:
            {{- include "bridgecart.backendEnv" . | nindent 12 }}
            - name: BRIDGECART_INITIAL_ADMIN_EMAIL
              valueFrom:
                secretKeyRef: {name: {{ .Values.backend.initialAdminSecret | quote }}, key: admin-email}
            - name: BRIDGECART_INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.backend.initialAdminSecret | quote }}, key: admin-password}
          resources:
            {{- toYaml .Values.backend.migrationResources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
{{- end }}
