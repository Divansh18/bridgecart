{{- if .Values.frontend.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bridgecart.fullname" . }}-frontend
spec:
  podSelector:
    matchLabels:
      {{- include "bridgecart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.backend.ingress.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.backend.ingress.podLabels | nindent 14 }}
      ports: [{protocol: TCP, port: 8080}]
{{- end }}
