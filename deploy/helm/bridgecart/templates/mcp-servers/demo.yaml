{{- range $kind, $config := dict "inventory" .Values.inventoryMcp "shipping" .Values.shippingMcp }}
{{- if $config.enabled }}
{{- $port := ternary 8002 8003 (eq $kind "inventory") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bridgecart.fullname" $ }}-{{ $kind }}-mcp
  labels:
    {{- include "bridgecart.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "bridgecart.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $kind }}-mcp
  ports:
    - {name: http, port: {{ $port }}, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bridgecart.fullname" $ }}-{{ $kind }}-mcp
  labels:
    {{- include "bridgecart.labels" $ | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "bridgecart.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $kind }}-mcp
  template:
    metadata:
      labels:
        {{- include "bridgecart.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $kind }}-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ $kind }}-mcp
          image: {{ $config.image | quote }}
          imagePullPolicy: {{ $config.imagePullPolicy }}
          ports:
            - {name: http, containerPort: {{ $port }}}
          env:
            - {name: {{ upper $kind }}_MCP_HOST, value: "0.0.0.0"}
            - name: {{ upper $kind }}_MCP_BEARER_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ $config.bearerSecret | quote }}, key: token}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml $config.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bridgecart.fullname" $ }}-{{ $kind }}-mcp
spec:
  podSelector:
    matchLabels:
      {{- include "bridgecart.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $kind }}-mcp
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "bridgecart.selectorLabels" $ | nindent 14 }}
              app.kubernetes.io/component: backend
      ports: [{protocol: TCP, port: {{ $port }}}]
---
{{- end }}
{{- end }}
