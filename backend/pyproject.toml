[project]
name = "bridgecart-backend"
version = "0.5.0"
description = "BridgeCart team API and MCP gateway"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.116,<1",
  "cryptography>=50,<51",
  "httpx2==2.13.1",
  "mcp==2.1.1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "uvicorn>=0.35,<1",
  "anthropic==1.13.0",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "mypy>=1.17,<2", "pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bridgecart"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["services"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["bridgecart"]
mypy_path = "src"
exclude = "services"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
norecursedirs = ["services", ".venv"]
