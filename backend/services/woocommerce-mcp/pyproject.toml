[project]
name = "bridgecart-woocommerce-mcp"
version = "0.3.4"
requires-python = ">=3.12,<3.13"
dependencies = ["mcp>=2.0,<3", "pydantic-settings>=2.10,<3", "httpx>=0.28,<1", "uvicorn>=0.35,<1", "starlette>=0.47,<1"]

[dependency-groups]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1", "mypy>=1.17,<2"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/woocommerce_mcp"]

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.12"
strict = true
packages = ["woocommerce_mcp"]
mypy_path = "src"
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
